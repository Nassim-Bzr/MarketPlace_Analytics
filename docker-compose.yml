# =====================================================================
# MarketPlace Analytics — stack Docker Compose
#
#   docker compose up -d                 # stack de base (Airflow + Postgres + MinIO)
#   COMPOSE_PROFILES=api,bi dans .env    # ajoute l'API Marketplace et Metabase
#
# Tous les identifiants viennent du fichier .env (voir .env.example).
# =====================================================================

name: marketplace-analytics

# ---------------------------------------------------------------------
# Image MinIO : minio/minio n'est plus publiée sur Docker Hub, on utilise
# l'image Chainguard (contient minio + mc + sh). Épinglée par digest pour
# que toute l'équipe ait exactement la même version.
# ---------------------------------------------------------------------
x-minio-image: &minio-image cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f

# ---------------------------------------------------------------------
# Bloc commun à tous les services Airflow.
# ⚠️ Après modification : docker compose up -d --force-recreate
# ---------------------------------------------------------------------
x-airflow-common: &airflow-common
  image: apache/airflow:3.1.8
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow/${AIRFLOW_DB_NAME}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow/${AIRFLOW_DB_NAME}
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Airflow 3 : le worker exécute les tâches en passant par l'API server
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Secrets partagés entre tous les composants (sinon erreurs de signature JWT)
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # @daily = intervalle de données de la veille : le run de minuit le J traite {{ ds }} = J-1
    # (sinon, en Airflow 3, il traiterait la journée J qui vient seulement de commencer)
    AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    # Sobriété mémoire (machines de formation) : 1 worker uvicorn, 4 tâches Celery en parallèle
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__CELERY__WORKER_CONCURRENCY: "4"
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
    # Les providers amazon (S3Hook) et postgres sont déjà dans l'image
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-pytest}

    # --- Connections Airflow (aucun secret dans le code des DAGs) ---
    AIRFLOW_CONN_MARKETPLACE_API: '{"conn_type": "http", "host": "http://api-marketplace:5000", "password": "${MARKETPLACE_API_TOKEN}"}'
    AIRFLOW_CONN_MINIO_S3: '{"conn_type": "aws", "login": "${MINIO_ROOT_USER}", "password": "${MINIO_ROOT_PASSWORD}", "extra": {"endpoint_url": "http://minio:9000", "region_name": "us-east-1"}}'
    AIRFLOW_CONN_POSTGRES_DWH: '{"conn_type": "postgres", "host": "postgres-dwh", "port": 5432, "login": "${DWH_USER}", "password": "${DWH_PASSWORD}", "schema": "${DWH_DB}"}'

    # --- Noms des buckets du data lake (médaillon) ---
    MINIO_BUCKET_BRONZE: bronze
    MINIO_BUCKET_SILVER: silver
    MINIO_BUCKET_GOLD: gold
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./tests:/opt/airflow/tests
  networks: [airflow-net]
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres-airflow:
      condition: service_healthy

services:

  # ===================================================================
  # Bases de données
  # ===================================================================

  # Métadonnées Airflow — pas de port exposé (5432 déjà pris sur certaines machines)
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - pg-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks: [airflow-net]

  # Data Warehouse — schémas staging / dwh / analytics créés par init-db/
  postgres-dwh:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DWH_USER}
      POSTGRES_PASSWORD: ${DWH_PASSWORD}
      POSTGRES_DB: ${DWH_DB}
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 : le volume se monte sur /var/lib/postgresql (plus /data)
      - pg-dwh-data:/var/lib/postgresql
      # Exécuté uniquement au premier démarrage (volume vide)
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DWH_USER}", "-d", "${DWH_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks: [airflow-net]

  # Broker Celery — pas de port exposé (6379 déjà pris sur certaines machines)
  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks: [airflow-net]

  # ===================================================================
  # Data lake MinIO (bronze / silver / gold)
  # ===================================================================

  minio:
    image: *minio-image
    # root : le volume nommé appartient à root, l'utilisateur par défaut (65532) ne peut pas y écrire
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [airflow-net]

  # Crée les buckets à chaque démarrage (idempotent), remplace scripts/legacy/minioray.py
  minio-init:
    image: *minio-image
    user: "0:0"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set lake http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing lake/bronze lake/silver lake/gold &&
        mc ls lake
    restart: "no"
    networks: [airflow-net]

  # ===================================================================
  # Airflow 3.1.8 (CeleryExecutor)
  # ===================================================================

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo "WARNING: AIRFLOW_UID non défini dans .env (mettre la sortie de 'id -u')"
        fi
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ""

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Arrêt propre des workers Celery
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ===================================================================
  # API Marketplace (Flask + Faker) — profil "api", code dans ./api (Medy)
  # ===================================================================

  api-marketplace:
    profiles: ["api"]
    build: ./api
    environment:
      API_TOKEN: ${MARKETPLACE_API_TOKEN}
      ORDERS_PER_DAY: ${ORDERS_PER_DAY:-1000}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [airflow-net]

  # ===================================================================
  # BI — profil "bi"
  # ===================================================================

  metabase:
    profiles: ["bi"]
    image: metabase/metabase:v0.59.6.1
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      # CRUCIAL : sans ce volume, les dashboards sont perdus à chaque down -v
      - metabase-data:/metabase-data
    depends_on:
      postgres-dwh:
        condition: service_healthy
    restart: unless-stopped
    networks: [airflow-net]

networks:
  airflow-net:
    driver: bridge

volumes:
  pg-airflow-data:
  pg-dwh-data:
  minio-data:
  metabase-data:
